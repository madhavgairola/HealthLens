<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Patient Module Test</title>
</head>

<body>
    <h1>Patient Module Test</h1>
    <ul id="results"></ul>

    <script type="module">
        import { grantConsent, revokeConsent } from "./js/patient/consent.js";
        // We can't easily test main dashboard logic headless, but we can check if it imports
        // Importing it might trigger DOMContentLoaded logic, which is fine

        const results = document.getElementById("results");
        function log(msg, success = true) {
            const li = document.createElement("li");
            li.textContent = msg;
            li.style.color = success ? "green" : "red";
            results.appendChild(li);
            console.log(msg);
        }

        try {
            log("Checking Patient Modules...");

            if (typeof grantConsent === "function")
                log("✅ consent.js (grantConsent) Module Loaded");
            else log("❌ consent.js Module Failed", false);

            if (typeof revokeConsent === "function")
                log("✅ consent.js (revokeConsent) Module Loaded");
            else log("❌ consent.js Module Failed", false);

        } catch (error) {
            log("❌ Critical Error: " + error.message, false);
            console.error(error);
        }
    </script>
</body>

</html>
