<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audit Logs - HealthLens</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <link rel="stylesheet" href="../css/global.css">
    <style>
        body {
            background: var(--bg-body);
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        }

        .log-table th,
        .log-table td {
            padding: 12px 20px;
            text-align: left;
            border-bottom: 1px solid var(--border-light);
        }

        .log-table th {
            background: var(--primary);
            color: white;
        }

        .log-table tr:hover {
            background: var(--header-report-bg);
        }

        /* Badges */
        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            font-weight: bold;
        }

        .bdg-access {
            background: #dbeafe;
            color: #1e40af;
        }

        .bdg-grant {
            background: #dcfce7;
            color: #166534;
        }

        .bdg-revoke {
            background: #fee2e2;
            color: #991b1b;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 style="color:var(--primary-dark);">Security Audit Logs</h1>
            <a href="../index.html" class="btn-primary" style="text-decoration:none; transform:none;">Back to Home</a>
        </header>

        <div class="card-medical">
            <table class="log-table">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>User (Actor)</th>
                        <th>Action</th>
                        <th>Target (Patient/Res)</th>
                    </tr>
                </thead>
                <tbody id="logBody">
                    <tr>
                        <td colspan="4" style="text-align:center;">Loading logs...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="../js/theme.js"></script>
    <script type="module" src="../js/audit/auditViewer.js"></script>
</body>

</html>
